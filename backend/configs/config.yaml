app:
  name: taskbridge
  environment: development
  port: "8080"

database:
  host: localhost
  port: "5432"
  user: taskbridge
  password: taskbridge
  name: taskbridge
  ssl_mode: disable
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 5m

redis:
  host: localhost
  port: "6379"
  password: ""
  db: 0

rabbitmq:
  url: amqp://guest:guest@localhost:5672/
  exchange: taskbridge.events

jwt:
  secret: change-me-in-production
  access_ttl: 900
  refresh_ttl: 604800

cors:
  allowed_origins:
    - http://localhost:3000
    - http://localhost:5173
    - http://localhost:8080
  allowed_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed_headers:
    - Origin
    - Content-Type
    - Accept
    - Authorization
    - X-Request-ID

server:
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s

platform:
  commission_percent: 8
